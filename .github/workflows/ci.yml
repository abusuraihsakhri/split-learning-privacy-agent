name: Test and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      AUDIT_SECRET_KEY: "ci-only-audit-key-not-for-production"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[api,test,numpy]"
      - name: Compile Python sources
        run: python -m compileall -q agents split_learning cli.py enrichment.py simulator.py
      - name: Check browser script syntax and local rule tests
        run: |
          node --check web/app.js
          node --test web/app.test.cjs
      - name: Run tests
        run: python -m pytest -q
      - name: Verify HMAC audit trail
        run: |
          python -c "from agents.base import AuditLogger; AuditLogger.log('CI','test','TEST',{'status':'OK'}); assert AuditLogger.verify_integrity()"
