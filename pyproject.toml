[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "split-learning-privacy-engine"
version = "2.0.0"
description = "SplitLearn-Sentinel: Cut-Layer Feature Splitting & Privacy Leakage Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.7,<3"]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]
api = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
all = ["numpy>=1.24", "fastapi>=0.111,<1", "uvicorn>=0.30,<1"]

[project.scripts]
split-learning-privacy-engine = "split_learning.cli:main"
split-learning-privacy-agent = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/split-learning-privacy-agent"
Repository = "https://github.com/abusuraihsakhri/split-learning-privacy-agent"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "split_learning_app"]

[tool.setuptools.packages.find]
include = ["agents*", "split_learning*"]
